[project]
name = "cagecheck"
version = "0.1.0"
description = "Cage consistency checker for H3 (Part A validation, Part B verdicts on the T1 abstraction)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

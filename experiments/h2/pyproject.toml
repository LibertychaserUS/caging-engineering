[project]
name = "h2"
version = "0.1.0"
description = "H2 — persuadability of the adjudicator (caging-engineering preregistration)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "evalplus==0.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["h2"]
